<svg width="100%" height="100%" viewBox="0 0 900 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Background Wave Gradient -->
    <linearGradient id="wave-back" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#6d28d9" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.15" />
    </linearGradient>

    <!-- Mid-Layer Wave Gradient -->
    <linearGradient id="wave-mid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.20" />
    </linearGradient>

    <!-- Foreground Base Fill (Blends into GitHub Dark #0d1117) -->
    <linearGradient id="wave-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#161b22" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>

    <!-- Glowing Top Crest Line (Matches Banner Accent) -->
    <linearGradient id="crest-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Layer 1: Slow Deep Background Swell (14s) -->
  <path fill="url(#wave-back)">
    <animate attributeName="d" dur="14s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" values="
        M 0,110 L 0,38 C 180,68 340,12 520,38 C 700,64 790,22 900,34 L 900,110 Z;
        M 0,110 L 0,28 C 180,10 360,62 540,32 C 720,8 810,54 900,26 L 900,110 Z;
        M 0,110 L 0,38 C 180,68 340,12 520,38 C 700,64 790,22 900,34 L 900,110 Z" />
  </path>

  <!-- Layer 2: Medium Counter-Flow Wave (10s) -->
  <path fill="url(#wave-mid)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" values="
        M 0,110 L 0,48 C 150,22 330,72 500,46 C 670,20 770,66 900,48 L 900,110 Z;
        M 0,110 L 0,56 C 170,76 350,24 520,54 C 690,78 780,30 900,56 L 900,110 Z;
        M 0,110 L 0,48 C 150,22 330,72 500,46 C 670,20 770,66 900,48 L 900,110 Z" />
  </path>

  <!-- Layer 3: Foreground Wave + Glowing Crest (7s) -->
  <path fill="url(#wave-front)" stroke="url(#crest-glow)" stroke-width="1.5">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" values="
        M -10,120 L -10,64 C 200,88 380,38 580,64 C 740,84 820,52 910,62 L 910,120 Z;
        M -10,120 L -10,58 C 220,36 400,86 600,56 C 750,36 830,76 910,56 L 910,120 Z;
        M -10,120 L -10,64 C 200,88 380,38 580,64 C 740,84 820,52 910,62 L 910,120 Z" />
  </path>
</svg>
