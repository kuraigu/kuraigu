<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#ff7b72" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.7" />
    </pattern>
  </defs>

  <!-- Background and Grid -->
  <rect width="900" height="200" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" />
  <rect width="900" height="200" rx="14" fill="url(#grid)" opacity="0.6" />

  <!-- Main Title -->
  <text x="450" y="100" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#f0f6fc" text-anchor="middle" letter-spacing="0.5">
    Innoh Reloza / DippedInSoju
  </text>

  <!-- Subtitle -->
  <text x="450" y="135" font-family="JetBrains Mono, Fira Code, monospace" font-size="15" fill="#8b949e" text-anchor="middle">
    Systems Engineer  •  Desktop + Game Developer  •  <tspan fill="#58a6ff">@kuraigu</tspan>
  </text>

  <!-- Bottom Gradient Line -->
  <rect x="250" y="165" width="400" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="320;440;320" dur="6s" repeatCount="indefinite" />
    <animate attributeName="x" values="290;230;290" dur="6s" repeatCount="indefinite" />
  </rect>
</svg>
